[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrospective-mvp-api"
version = "0.1.0"
description = "FastAPI backend for the retrospective MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.140",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

